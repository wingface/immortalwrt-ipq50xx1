name: 编译 OpenWrt 固件

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev \
          git gawk gettext libssl-dev libelf-dev unzip bzip2 wget curl file \
          python3 python3-pip python3-distutils

      - name: 下载 OpenWrt 源码
        run: git clone https://github.com/openwrt/openwrt.git openwrt

      - name: 开始编译
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make -j$(nproc)

      - name: 打包固件
        run: |
          mkdir -p firmware
          cp -r openwrt/bin/targets/*/* firmware/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: firmware/
