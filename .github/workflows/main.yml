name: OpenWrt 编译

on:
  workflow_dispatch:  # 手动启动

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 强制 Node24 消除警告
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TONODE24=true" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev \
          git gawk gettext libelf-dev unzip bzip2 wget curl file python3

      - name: 下载源码
        run: git clone https://github.com/openwrt/openwrt.git openwrt

      - name: 编译配置
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 开始编译（单线程避免失败）
        run: |
          cd openwrt
          make -j1 V=s  # -j1 最稳定，不会报错
